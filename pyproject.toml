[tool.uv.workspace]
members = ["runtime", "cli"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["runtime/tests", "providers", "cli/tests"]
pythonpath = ["runtime/tests", "providers"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vocalis", "vocalis_cli", "helpers", "provider_testing"]
