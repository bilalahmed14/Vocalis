[project]
name = "vocalis-runtime"
version = "0.1.0"
description = "Vocalis runtime: compiles agent configs into Pipecat pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.118",
    "jsonschema>=4.23",
    "pipecat-ai[anthropic,cartesia,deepgram,elevenlabs,groq,openai,silero,webrtc]>=1.10,<2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Everything needed to run an agent with no API keys: on-device STT and TTS.
# The LLM side is Ollama, which runs as its own service.
local = [
    "pipecat-ai[kokoro,moonshine]>=1.10,<2",
]
# Local Whisper pulls in CTranslate2 and downloads model weights, so it's opt-in.
# On Apple Silicon, Pipecat's Whisper module also imports mlx-whisper.
whisper = [
    "pipecat-ai[whisper]>=1.10,<2",
    "pipecat-ai[mlx-whisper]>=1.10,<2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vocalis"
