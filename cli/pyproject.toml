[project]
name = "vocalis-cli"
version = "0.1.0"
description = "Run Vocalis voice agents from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "vocalis-runtime",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
]

[project.scripts]
vocalis = "vocalis_cli.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
vocalis-runtime = { workspace = true }
