# Vocalis stack. From the repo root:
#   docker compose -f deploy/docker-compose.yml up
name: vocalis

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocalis
      POSTGRES_PASSWORD: vocalis
      POSTGRES_DB: vocalis
    ports:
      # Override with VOCALIS_DB_PORT if 5432 is taken on your machine.
      - "${VOCALIS_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep the cluster in a subdirectory of this path.
      - vocalis-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocalis -d vocalis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/runtime.Dockerfile
    environment:
      DATABASE_URL: postgresql://vocalis:vocalis@postgres:5432/vocalis
      VOCALIS_CORS_ORIGINS: http://localhost:3000
    # Provider API keys. Copy .env.example to .env first; without it the API still
    # runs, and only starting a call needs the keys.
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Override with VOCALIS_API_PORT if 8000 is taken on your machine.
      - "${VOCALIS_API_PORT:-8000}:8000"

  dashboard:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/dashboard.Dockerfile
    environment:
      # Server-side only: the browser talks to the dashboard, which proxies the API.
      VOCALIS_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Override with VOCALIS_DASHBOARD_PORT if 3000 is taken on your machine.
      - "${VOCALIS_DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  vocalis-db:
