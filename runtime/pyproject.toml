[project]
name = "vocalis-runtime"
version = "0.1.0"
description = "Vocalis runtime: compiles agent configs into Pipecat pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pipecat-ai>=1.10,<2",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vocalis"
